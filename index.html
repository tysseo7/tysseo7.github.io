<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi App Final Verification</title>
    <!-- SDKを最優先で同期読み込み -->
    <script src="https://minepi.com"></script>
</head>
<body style="font-family: sans-serif; text-align: center; margin-top: 100px; background-color: #f4f6f9;">

    <h1 style="color: #5a2d82;">🟣● Pi Node Monitor - Final Verification</h1>
    <p>Click the button below inside the Pi Browser to complete the final transaction check.</p>
    
    <!-- 100%強制起動用のボタン -->
    <button id="pay-button" style="background-color: #5a2d82; color: white; border: none; padding: 15px 30px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        Run Test Payment (0.1 Pi)
    </button>

    <script>
        // ページ読み込み時に強制的に初期化を試みる
        try {
            Pi.init({ version: "2.0", sandbox: true });
        } catch(e) { console.log(e); }

        document.getElementById('pay-button').addEventListener('click', async function() {
            try {
                // 安全弁（Loadingエラーメッセージ）をすべて取り払い、ダイレクトに決済を要求
                const scopes = ['payments'];
                const auth = await Pi.authenticate(scopes, function(incompletePayment) {
                    console.log("Incomplete payment:", incompletePayment);
                });
                
                const paymentData = {
                    amount: 0.1,
                    memo: "SoloHost App Checklist Test Payment",
                    metadata: { appId: "com.tysseo7.pimonitor" }
                };

                const callbacks = {
                    onReadyForServerApproval: function(paymentId) { console.log("Created:", paymentId); },
                    onReadyForServerCompletion: function(paymentId, txid) { alert("Test Payment Successful! TXID: " + txid); },
                    onCancel: function() { console.log("Cancelled"); },
                    onError: function(err) { alert("Payment error: " + err.message); }
                };

                // ブラウザのネイティブ決済を直接呼び出し
                await Pi.createPayment(paymentData, callbacks);

            } catch (error) {
                alert("Error: " + error.message);
            }
        });
    </script>
</body>
</html>
